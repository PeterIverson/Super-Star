data:
  name: mocap
  dir: Data/JIYI_processed
  test_files: ["CAREER_1_4_001_bar_1", "GAME_7_13_001_bar_1", "HEALTH_7_11_001_bar_1", "RELATIONSHIP_12_17_001_bar_1", "CAREER_1_4_001_mirror_bar_1", "GAME_7_13_001_mirror_bar_1", "HEALTH_7_11_001_mirror_bar_1", "RELATIONSHIP_12_17_001_mirror_bar_1"]
  seq_len_train: 120  
  stride_train: 8 
  seq_len_test: 2400 
  stride_test: 2400 
  samples_per_test: 1  
  ds_rate: 8 

optimizer:
  type: AdamW
  kwargs:
    lr: 0.0005
#    betas: [0.5, 0.999]
    betas: [0.9, 0.999]
    weight_decay: 0
  schedular_kwargs:
    milestones: [80, 150, 220]
    gamma: 0.4

exp_name: train_gpt_jiyi_audio_causal_cross
log_name: motion_gpt_1
need_not_train_data: 0
need_not_test_data: 1

seed: 42
batch_size: 256
epochs: 200
save_per_epochs: 10
eval_per_epochs: 10
log_per_updates: 1
tensorboard: True
cuda: True
global_vel: False

vqvae_weight: 'Experiment/train_rqvae_jiyi/jiyi_rqvae_20251028_20251029171426/Checkpoint/epoch_200.pt'

init_weight: ''
