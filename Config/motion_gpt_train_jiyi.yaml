    embd_pdrop: 0.1
    resid_pdrop: 0.1
    attn_pdrop: 0.1
    vocab_size_body: 512
    vocab_size_hands: 512
    block_size: 14
    n_layer: 6
    n_head: 12
    n_embd: 768
    n_music: 437
